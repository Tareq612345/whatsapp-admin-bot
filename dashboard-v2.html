<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Gate</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6f8;color:#172126;font-family:system-ui,Tahoma}.wrap{max-width:1200px;margin:auto;padding:28px}.top,.row,.item{display:flex;align-items:center;justify-content:space-between;gap:12px}.top{margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid #e1e8eb;border-radius:15px;padding:18px;margin-bottom:14px;box-shadow:0 12px 30px #17333f0b}.n{font-size:27px;font-weight:800}.muted{color:#738087;font-size:12px}.btn{border:0;border-radius:9px;padding:10px 14px;background:#168c62;color:#fff;cursor:pointer}.red{background:#d84d4d}input,select,textarea{width:100%;padding:10px;border:1px solid #dce4e7;border-radius:9px;font:inherit}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{border-top:1px solid #edf0f2;padding:12px 0;align-items:flex-start}.text{white-space:pre-wrap;background:#f5f7f8;padding:8px;border-radius:8px;max-height:90px;overflow:auto}.badge{background:#e5f5ef;color:#168c62;border-radius:20px;padding:4px 8px;font-size:11px}@media(max-width:700px){.grid,.form{grid-template-columns:1fr 1fr}.top,.item{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><div><h1>Student Gate</h1><div class="muted">تحقق الكارنيه والقبول التلقائي — محلي بالكامل</div></div><a class="btn" href="/api/export">تصدير Excel</a></div><div class="grid"><div class="card"><div class="muted">واتساب</div><div class="n" id="ready">—</div></div><div class="card"><div class="muted">الإجمالي</div><div class="n" id="total">0</div></div><div class="card"><div class="muted">مقبول</div><div class="n" id="approved">0</div></div><div class="card"><div class="muted">مراجعة</div><div class="n" id="review">0</div></div></div><div class="card"><h2>الإعدادات</h2><div class="form"><label>Dry-run<select id="dry"><option value="true">مفعّل</option><option value="false">متوقف</option></select></label><label>قبول تلقائي<select id="auto"><option value="true">مفعّل</option><option value="false">متوقف</option></select></label><label>OCR<select id="enabled"><option value="true">مفعّل</option><option value="false">متوقف</option></select></label><label>أقل ثقة<input id="confidence" type="number" min="1" max="100"></label></div><button class="btn" onclick="settings()" style="margin-top:12px">حفظ</button></div><div class="card"><div class="row"><h2>قواعد الجروبات</h2><button class="btn" onclick="newRule()">قاعدة جديدة</button></div><div id="ruleForm" hidden><input id="rid" type="hidden"><div class="form"><label>الجروب<select id="group"></select></label><label>اسم الجروب<input id="name"></label></div><label>الكلمات — كلمة في كل سطر<textarea id="keywords" rows="5"></textarea></label><button class="btn" onclick="saveRule()">حفظ القاعدة</button></div><div id="rules"></div></div><div class="card"><h2>سجل الطلاب</h2><div id="records"></div></div></div><script>const $=x=>document.getElementById(x),api=async(u,o={})=>{const r=await fetch(u,{headers:{'Content-Type':'application/json'},...o}),d=await r.json();if(!r.ok)throw Error(d.error);return d},post=(action,x={})=>api('/api/action',{method:'POST',body:JSON.stringify({action,...x})});let S,G=[];const esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));async function load(){const[s,g,r]=await Promise.all([api('/api/status'),api('/api/groups'),api('/api/records')]);S=s;G=g.groups;$('ready').textContent=s.ready?'متصل':'غير متصل';$('total').textContent=s.stats.total;$('approved').textContent=s.stats.approved;$('review').textContent=s.stats.review;$('dry').value=String(s.config.dryRun);$('auto').value=String(s.config.autoApprove);$('enabled').value=String(s.config.enabled);$('confidence').value=s.config.minConfidence;$('group').innerHTML=G.map(x=>`<option value="${x.id}">${esc(x.name)} — ${x.id}</option>`).join('');$('rules').innerHTML=s.config.rules.map(x=>`<div class="item"><div><b>${esc(x.groupName||x.groupId)}</b><div class="muted">${x.keywords.map(esc).join(' • ')}</div></div><div><button class="btn" onclick='edit(${JSON.stringify(x)})'>تعديل</button> <button class="btn red" onclick="del('${x.id}')">حذف</button></div></div>`).join('')||'<p class="muted">أرسل رسالة من الجروب ليظهر، ثم أضف قاعدة.</p>';$('records').innerHTML=r.records.map(x=>`<div class="item"><div><b>#${x.id} — ${x.sender_number}</b> <span class="badge">${x.status}</span><div class="muted">${esc(x.decision_reason)} — ${Number(x.confidence||0).toFixed(1)}%</div><div class="text">${esc(x.extracted_text)}</div></div>${x.status==='review'?`<div><button class="btn" onclick="review(${x.id},'approve')">قبول</button> <button class="btn red" onclick="review(${x.id},'reject')">رفض</button></div>`:''}</div>`).join('')||'<p class="muted">لا توجد سجلات بعد.</p>'}async function settings(){await post('settings',{settings:{dryRun:$('dry').value==='true',autoApprove:$('auto').value==='true',enabled:$('enabled').value==='true',minConfidence:Number($('confidence').value)}});load()}function newRule(){$('ruleForm').hidden=false;$('rid').value='';$('name').value='';$('keywords').value=''}function edit(x){newRule();$('rid').value=x.id;$('group').value=x.groupId;$('name').value=x.groupName||'';$('keywords').value=x.keywords.join('\n')}async function saveRule(){await post('saveRule',{rule:{id:$('rid').value||undefined,groupId:$('group').value,groupName:$('name').value,keywords:$('keywords').value.split('\n').map(x=>x.trim()).filter(Boolean)}});$('ruleForm').hidden=true;load()}async function del(id){if(confirm('حذف القاعدة؟')){await post('deleteRule',{id});load()}}async function review(id,decision){await post('review',{id,decision});load()}load();setInterval(load,15000)</script></body></html>
