<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Gate</title><style>:root{--green:#168c62;--bg:#f3f6fa;--line:#dfe6ef;--muted:#718096}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#14213d;font-family:system-ui,Tahoma}.wrap{max-width:1320px;margin:auto;padding:28px}.top,.row,.record{display:flex;align-items:center;justify-content:space-between;gap:14px}.top{margin-bottom:22px}.top h1{margin:0}.muted{color:var(--muted);font-size:12px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;margin-bottom:14px;box-shadow:0 10px 30px #1c31540a}.num{font-size:28px;font-weight:800;margin-top:8px}.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--green);color:#fff;cursor:pointer;text-decoration:none}.red{background:#d84d4d}.secondary{background:#fff;color:#14213d;border:1px solid var(--line)}input,select,textarea{width:100%;padding:10px;border:1px solid #d6dfeb;border-radius:9px;font:inherit}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.columns{display:grid;grid-template-columns:.8fr 1.2fr;gap:14px}.record{border-top:1px solid #edf0f4;padding:14px 0;align-items:flex-start}.record-main{flex:1}.fields{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:9px}.field{background:#f5f7fa;border-radius:8px;padding:8px}.field b{display:block;font-size:12px;margin-top:3px}.badge{display:inline-block;background:#e5f5ef;color:var(--green);border-radius:20px;padding:4px 8px;font-size:11px}.badge.review{background:#fff2db;color:#a45e00}.badge.failed,.badge.rejected{background:#fde8e8;color:#c53c3c}.text{white-space:pre-wrap;background:#f6f8fb;padding:9px;border-radius:8px;max-height:120px;overflow:auto;margin-top:8px}.actions{display:flex;gap:7px;flex-wrap:wrap}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}.fields{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.wrap{padding:14px}.top,.record{align-items:flex-start;flex-direction:column}.form{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="top"><div><h1>Student Gate</h1><div class="muted">صور الخاص فقط • استخراج منظم • طابور آمن للضغط</div></div><div class="actions"><button class="btn secondary" onclick="load()">تحديث</button><a class="btn" href="/api/export">تصدير Excel</a></div></header><section class="stats"><div class="card"><div class="muted">واتساب</div><div class="num" id="ready">—</div></div><div class="card"><div class="muted">إجمالي الصور</div><div class="num" id="total">0</div></div><div class="card"><div class="muted">تم القبول</div><div class="num" id="approved">0</div></div><div class="card"><div class="muted">تحتاج مراجعة</div><div class="num" id="review">0</div></div><div class="card"><div class="muted">في طابور القراءة</div><div class="num" id="queued">0</div></div></section><section class="columns"><div><div class="card"><h2>الإعدادات</h2><div class="form"><label>Dry-run<select id="dry"><option value="true">مفعّل</option><option value="false">متوقف</option></select></label><label>قبول تلقائي<select id="auto"><option value="true">مفعّل</option><option value="false">متوقف</option></select></label><label>قراءة الصور<select id="enabled"><option value="true">مفعّلة</option><option value="false">متوقفة</option></select></label><label>أقل ثقة<input id="confidence" type="number" min="1" max="100"></label></div><button class="btn" onclick="settings()" style="margin-top:12px">حفظ</button></div><div class="card"><div class="row"><h2>قواعد الجروبات</h2><button class="btn" onclick="newRule()">قاعدة جديدة</button></div><div id="ruleForm" hidden><input id="rid" type="hidden"><label>الجروب<select id="group"></select></label><label>اسم ظاهر<input id="name"></label><label>كلمات البطاقة — كلمة أو عبارة في كل سطر<textarea id="keywords" rows="5" placeholder="كلية العلاج الطبيعي"></textarea></label><button class="btn" onclick="saveRule()">حفظ</button></div><div id="rules"></div></div></div><div class="card"><div class="row"><h2>بيانات الطلاب</h2><select id="filter" onchange="loadRecords()" style="max-width:180px"><option value="">كل الحالات</option><option value="review">مراجعة</option><option value="approved">مقبول</option><option value="rejected">مرفوض</option><option value="failed">فشل</option></select></div><div id="records"></div></div></section></main><script>const $=x=>document.getElementById(x),esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])),api=async(u,o={})=>{const r=await fetch(u,{headers:{'Content-Type':'application/json'},...o}),d=await r.json();if(!r.ok)throw Error(d.error);return d},post=(action,x={})=>api('/api/action',{method:'POST',body:JSON.stringify({action,...x})});let S,G=[];async function load(){const[s,g]=await Promise.all([api('/api/status'),api('/api/groups')]);S=s;G=g.groups;$('ready').textContent=s.ready?'متصل':'غير متصل';for(const k of['total','approved','review','queued'])$(k).textContent=s.stats[k]||0;$('dry').value=String(s.config.dryRun);$('auto').value=String(s.config.autoApprove);$('enabled').value=String(s.config.enabled);$('confidence').value=s.config.minConfidence;$('group').innerHTML=G.map(x=>`<option value="${x.id}">${esc(x.name)} — ${x.id}</option>`).join('');$('rules').innerHTML=s.config.rules.map(x=>`<div class="record"><div><b>${esc(x.groupName||x.groupId)}</b><div class="muted">${x.keywords.map(esc).join(' • ')}</div></div><div class="actions"><button class="btn secondary" onclick='edit(${JSON.stringify(x)})'>تعديل</button><button class="btn red" onclick="del('${x.id}')">حذف</button></div></div>`).join('')||'<p class="muted">أضف قاعدة تربط اسم الكلية بالجروب.</p>';loadRecords()}async function loadRecords(){const f=$('filter').value,r=await api('/api/records'+(f?'?status='+f:''));$('records').innerHTML=r.records.map(x=>`<article class="record"><div class="record-main"><div><b>#${x.id} — ${esc(x.student_name||'اسم غير واضح')}</b> <span class="badge ${x.status}">${x.status}</span></div><div class="fields"><div class="field"><span class="muted">رقم واتساب</span><b>${esc(x.sender_number)}</b></div><div class="field"><span class="muted">الرقم القومي</span><b>${esc(x.national_id||'يحتاج مراجعة')}</b></div><div class="field"><span class="muted">الكلية</span><b>${esc(x.college||'—')}</b></div><div class="field"><span class="muted">الفرقة</span><b>${esc(x.cohort||'—')}</b></div><div class="field"><span class="muted">العام</span><b>${esc(x.academic_year||'—')}</b></div></div><details><summary class="muted">النص الكامل — الثقة ${Number(x.confidence||0).toFixed(1)}%</summary><div class="text">${esc(x.extracted_text)}</div></details><div class="muted">${esc(x.decision_reason)}</div></div>${x.status==='review'?`<div class="actions"><button class="btn" onclick="review(${x.id},'approve')">قبول</button><button class="btn red" onclick="review(${x.id},'reject')">رفض</button></div>`:''}</article>`).join('')||'<p class="muted">لا توجد سجلات.</p>'}async function settings(){await post('settings',{settings:{dryRun:$('dry').value==='true',autoApprove:$('auto').value==='true',enabled:$('enabled').value==='true',minConfidence:Number($('confidence').value)}});load()}function newRule(){$('ruleForm').hidden=false;$('rid').value='';$('name').value='';$('keywords').value=''}function edit(x){newRule();$('rid').value=x.id;$('group').value=x.groupId;$('name').value=x.groupName||'';$('keywords').value=x.keywords.join('\n')}async function saveRule(){await post('saveRule',{rule:{id:$('rid').value||undefined,groupId:$('group').value,groupName:$('name').value,keywords:$('keywords').value.split('\n').map(x=>x.trim()).filter(Boolean)}});$('ruleForm').hidden=true;load()}async function del(id){if(confirm('حذف القاعدة؟')){await post('deleteRule',{id});load()}}async function review(id,decision){await post('review',{id,decision});loadRecords()}load();setInterval(load,15000)</script></body></html>
