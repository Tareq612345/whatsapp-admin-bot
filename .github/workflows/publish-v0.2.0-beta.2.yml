name: Publish v0.2.0-beta.2 Windows pre-release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "release-notes/v0.2.0-beta.2.md"
      - ".github/workflows/publish-v0.2.0-beta.2.yml"

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source and run tests
        run: |
          npm run check
          npm test

      - name: Build unpacked Windows application
        run: npm run pack:win

      - name: Verify packaged OCR files
        shell: pwsh
        run: |
          $asar = "release/win-unpacked/resources/app.asar"
          $worker = "release/win-unpacked/resources/app.asar.unpacked/ocr/rapid_worker.py"
          if (!(Test-Path $asar)) { throw "app.asar is missing" }
          if (!(Test-Path $worker)) { throw "RapidOCR worker is missing" }
          $listing = npx asar list $asar
          if (!($listing -match "tesseract-core-simd-lstm.wasm")) { throw "SIMD-LSTM OCR core is missing" }
          if (!($listing -match "tesseract-core-lstm.wasm")) { throw "Fallback LSTM OCR core is missing" }

      - name: Run packaged restart smoke test
        shell: pwsh
        run: |
          $exe = Resolve-Path "release/win-unpacked/WhatsApp Admin Studio.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Packaged smoke test failed with exit code $($process.ExitCode)" }

      - name: Build NSIS installer
        run: npm run dist:win

      - name: Create checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem "release/WhatsApp-Admin-Studio-Setup-*.exe" | Select-Object -First 1
          if (!$installer) { throw "Installer not found" }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content "release/SHA256SUMS.txt"

      - name: Publish GitHub pre-release
        shell: pwsh
        run: |
          $tag = "v0.2.0-beta.2"
          $installer = (Get-ChildItem "release/WhatsApp-Admin-Studio-Setup-*.exe" | Select-Object -First 1).FullName
          if (gh release view $tag 2>$null) {
            gh release upload $tag $installer "release/SHA256SUMS.txt" --clobber
          } else {
            gh release create $tag $installer "release/SHA256SUMS.txt" `
              --target "${{ github.sha }}" `
              --title "WhatsApp Admin Studio v0.2.0-beta.2" `
              --notes-file "release-notes/v0.2.0-beta.2.md" `
              --prerelease
          }
